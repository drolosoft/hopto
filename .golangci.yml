version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
  settings:
    gocritic:
      enabled-checks:
        - dupImport
        - ifElseChain
        - nestingReduce
        - unnecessaryBlock
    # hopto's comments favour British spelling (favourites, colour,
    # neighbours), but Usage.Favorites is an exported field whose JSON tag
    # is already on disk in every user's usage.json, and "localized" mirrors
    # the literal macOS folder suffix (Edge Apps.localized) — neither is a
    # typo to fix, so both spellings are allowed alongside the UK locale.
    # Normalize is the exported name the icons package uses, and color is
    # the standard library package image/color, neither of which can be
    # renamed. Center is the App's window interface method, named to match
    # Wails' own runtime API (window.Center()); it is an exported method
    # name, not a typo. colors only appears inside the Win32 constant
    # DIB_RGB_COLORS, quoted in a comment where GetDIBits is called.
    misspell:
      locale: UK
      ignore-rules:
        - favorite
        - favorites
        - localized
        - motivacional
        - normalize
        - color
        - center
        - colors
  exclusions:
    paths:
      - testdata

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

run:
  timeout: 5m
