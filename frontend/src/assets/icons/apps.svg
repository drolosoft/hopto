<!-- The apps tab: a 2x2 grid of rounded squares. Solid black is enough —
     the stylesheet uses this file as a mask, so only the shape matters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <rect x="2" y="2" width="4.67" height="4.67" rx="0.8" fill="#000"/>
    <rect x="9.33" y="2" width="4.67" height="4.67" rx="0.8" fill="#000"/>
    <rect x="2" y="9.33" width="4.67" height="4.67" rx="0.8" fill="#000"/>
    <rect x="9.33" y="9.33" width="4.67" height="4.67" rx="0.8" fill="#000"/>
</svg>
