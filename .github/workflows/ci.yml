name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these workflows only ever check out and read the
# repository, never write to it or to anything else on GitHub's side.
permissions:
  contents: read

jobs:
  test:
    # Carbon and Cocoa only compile on macOS; there is no Linux build.
    runs-on: macos-latest

    steps:
      # The tags are needed for `git describe` in make build; the default
      # shallow clone has none and the version would read as a bare hash.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Public repository: refuse any tracked internal working file. Runs
      # first so a leak fails fast, and in CI so --no-verify cannot skip it.
      - name: Guard against internal files
        run: bash scripts/check-internal-files.sh --tree

      # The guard's own test suite: a change to the guard script that
      # silently drops a case would otherwise only be caught by hand.
      - name: Guard self-test
        run: bash scripts/check-internal-files_test.sh

      # The release notes come out of CHANGELOG.md through this script; a
      # change that broke it would otherwise show only on the next tag.
      - name: Release notes self-test
        run: bash scripts/changelog-section_test.sh

      # set_aside/put_back are what stand between a script's own runs and
      # the user's real data folder; a regression here belongs in CI, not
      # in someone's Application Support.
      - name: Real-app helpers self-test
        run: bash scripts/real-app_test.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Runs before the build: it only needs the sources already in the
      # checkout, not the generated frontend/wailsjs bindings.
      - name: Frontend tests
        run: cd frontend && npm ci && npm test

      # make build stamps the version, commit and date into the binary;
      # it writes frontend/wailsjs and frontend/dist. The root package
      # (main) embeds the page, so go vet and go test cannot compile it
      # before the build; the packages under internal do not need it.
      - name: Build
        run: make build

      - name: Go tests
        run: go vet ./... && go test -race -count=1 -cover ./...

      # WebKit is what the WKWebView runs; the harness serves the page that
      # wails build just produced, with the fake bridge in place of Go.
      - name: Playwright WebKit
        run: cd frontend && npx playwright install webkit && npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results

      - name: Fmt check
        run: test -z "$(gofmt -l .)"

      - uses: actions/upload-artifact@v4
        with:
          name: hopto-unsigned
          path: build/bin/hopto.app

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: "latest" floats and breaks the build on its own
          # schedule, the way v2.14's stricter config verify broke this
          # workflow the first time it ran, out of step with any commit
          # of ours. Bump this by hand when we're ready to test the new
          # version, not because a runner picked it for us.
          version: v2.14

  windows-build:
    # Cross-compiled from macOS: Wails is pure Go on Windows. A compile
    # error in a *_windows.go file must not reach main.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Vet for Windows
        run: CGO_ENABLED=0 GOOS=windows go vet ./...
      - name: Windows exes
        run: make build-windows
      - uses: actions/upload-artifact@v4
        with:
          name: hopto-windows-unsigned
          path: build/bin/hopto-windows-*.exe

  windows-test:
    # The Windows-only tests (tables, paths, rules) run on real Windows
    # here; the native layer still needs a desktop and is checked by hand.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go tests on Windows
        run: go test -count=1 ./...
