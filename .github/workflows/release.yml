name: Release

on:
  push:
    tags: ['v*']
  # A rehearsal by hand from a branch: every step, signing and
  # notarisation included, except the tag checks and the release itself,
  # which a rehearsal never creates. A run started by hand on a tag ref
  # is a tag run like a push: it checks the tag and publishes.
  workflow_dispatch:

# Nothing by default; each job asks for the least it needs.
permissions: {}

# Artefact names belong to their run, so two runs never clash on those.
# What two runs for the same tag or branch would do is create the same
# release twice and notarise everything twice. The second waits instead
# of cancelling the first, which may be half way through a notarisation.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails fast, before a macOS runner starts, on what would otherwise
  # only fail after the build: a missing Apple secret, or a release that
  # already exists for this tag. A job of its own because a step cannot
  # test a secret in its `if:`, and the build job must never hold a
  # secret: here the values reach one step's environment, are only tested
  # for emptiness, and no third-party code runs in this job at all.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # A tag and a rehearsal both sign and notarise, so both need every
      # Apple secret. The message names each missing one. ${!name} reads
      # the variable whose name is in $name; nothing here prints a value.
      - name: Apple secrets are set
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          missing=""
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_PASSWORD APPLE_ID TEAM_ID NOTARIZATION_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "these secrets are not set:$missing" >&2
            exit 1
          fi

      # gh release create would refuse an existing release only at the
      # very end, after two notarisations and perhaps a SignPath approval.
      # Only "release not found" counts as absent: any other failure (the
      # network, the token) stops the run rather than passing for it.
      - name: No release for this tag yet
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if answer="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            echo "a release for $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          if ! printf '%s\n' "$answer" | grep -q 'release not found'; then
            echo "could not tell whether a release for $GITHUB_REF_NAME exists: $answer" >&2
            exit 1
          fi

  # The checks, the Windows exes and the unsigned universal app. This job
  # runs third-party code (npm ci, the npm install inside wails build, Go
  # modules under go test), any of which could write to $GITHUB_ENV or
  # $GITHUB_PATH and reach every later step, so it holds no secret: the
  # signing happens in sign-macos, on a runner this code never touched.
  build:
    needs: preflight
    # Carbon and Cocoa only build on macOS, and the universal binary needs
    # the Apple toolchain for both architectures; the Windows exes
    # cross-compile here too.
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      product: ${{ steps.version.outputs.product }}

    steps:
      # The whole history, so git describe finds the last tag in a
      # rehearsal and main is there for the ancestry check. No stored
      # credential: nothing in this job pushes, and the gh calls bring
      # their own token.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag and the bundle's own version must agree, or the files
      # would say one version and the Finder another. A rehearsal has no
      # tag to compare.
      - name: Tag matches wails.json
        if: github.ref_type == 'tag'
        run: |
          want="v$(jq -r .info.productVersion wails.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME, but wails.json says $want" >&2
            exit 1
          fi

      # A release is public for good: the guard runs here too, and in a
      # rehearsal as well, whose files can be downloaded.
      - name: Guard against internal files
        run: bash scripts/check-internal-files.sh --tree

      # Fails early, before a long build, when the notes are missing. The
      # version comes from wails.json, which on a tag the step above has
      # just matched to the tag, so a rehearsal checks the notes the next
      # tag will need. The publish job writes them again from the same
      # commit.
      - name: Release notes
        run: bash scripts/changelog-section.sh "v$(jq -r .info.productVersion wails.json)" > /dev/null

      # This job skips golangci-lint, gofmt, Playwright and the tests on
      # Windows, all of which CI runs on this same commit: a tag must sit
      # on a commit CI passed, or this release would publish a build CI
      # would have refused. A rehearsal is held to the same rule, since
      # its files are what a release of that commit would be. All four of
      # CI's jobs must have run, and every run of each must be green: a
      # commit pushed to main from a pull request has two runs of each,
      # and the older one may be the one that failed. A run that has not
      # finished has no conclusion yet and counts as not green.
      - name: Require CI green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, (.conclusion // "unfinished")] | @tsv')"
          failed=0
          for job in test lint windows-build windows-test; do
            conclusions="$(printf '%s\n' "$runs" | awk -F '\t' -v job="$job" '$1 == job { print $2 }')"
            if [ -z "$conclusions" ]; then
              echo "CI's $job job has not run on $GITHUB_SHA" >&2
              failed=1
            elif printf '%s\n' "$conclusions" | grep -qvx success; then
              echo "CI's $job job on $GITHUB_SHA is not green (got: $(printf '%s' "$conclusions" | tr '\n' ' '))" >&2
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      # CI's test job also runs for pull requests, so a green check-run
      # alone would let a tag on an unmerged pull request's head through.
      # A release comes only from main. The full-history checkout already
      # brings origin/main; it is fetched here only if it somehow did not,
      # which needs no credential on a public repository. A rehearsal runs
      # from a branch that is not on main by definition, so it is held to
      # the check-run rule alone.
      - name: Tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main" >&2
            exit 1
          fi

      # The version every file and every make call of this run uses: the
      # tag, or what git describes in a rehearsal. Fixed here once,
      # because the Makefile's own default adds -dirty, and wails build
      # runs npm install, which may rewrite the lock file between one
      # build and the next and give the files another name than the later
      # jobs expect. Anything but vX.Y.Z or git describe's vX.Y.Z-N-gHASH
      # is refused now: a tag such as v0.3.0-rc1 would otherwise fail only
      # in WiX, after both notarisations. The MSI wants the version as
      # three numbers, which wails.json has.
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always)"
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+-g[0-9a-f]+)?$'; then
            echo "version $version is neither vX.Y.Z nor vX.Y.Z-N-gHASH" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "product=$(jq -r .info.productVersion wails.json)" >> "$GITHUB_OUTPUT"

      # No cache in this workflow: one saved by another run, a pull
      # request's among them, must not feed the build that gets signed.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Frontend tests
        run: cd frontend && npm ci && npm test

      # First, because it cleans build/bin, and so does the universal
      # build after it: the exes leave this job before that happens.
      - name: Windows exes
        run: make build-windows

      # overwrite: a re-run of the failed jobs runs this upload again in
      # the same run, where the name already exists. One day is enough
      # for an artefact that only feeds the later jobs of this run.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exes
          path: build/bin/hopto-windows-*.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # Refuses a binary that carries the runner's home folder.
      - name: Universal app
        run: make app-universal

      # The Go package embeds frontend/dist, which the build just wrote.
      # Before the app leaves this job, so a failing test spends no
      # notarisation.
      - name: Go tests
        run: go vet ./... && go test -race -count=1 ./...

      # The artefact zip loses the executable bit and the symlinks inside
      # the bundle; a tar keeps both.
      - name: App archive
        run: tar -C build/bin -cf hopto-app.tar hopto.app

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app-unsigned
          path: hopto-app.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The app and the disk image, signed, notarised and stapled, or the job
  # fails. The only job with the Apple secrets, and it runs nothing from
  # npm or Go: the repository's own scripts and Apple's tools.
  sign-macos:
    needs: build
    runs-on: macos-latest
    # Two notarisations of up to 30 minutes each.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      # Checked first, so the message names a missing secret before
      # anything else runs. ${!name} reads the variable whose name is in
      # $name; nothing here prints a value.
      - name: Apple secrets are set
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          missing=""
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_PASSWORD APPLE_ID TEAM_ID NOTARIZATION_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "these secrets are not set:$missing" >&2
            exit 1
          fi

      # Only for the scripts.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: macos-app-unsigned
          path: app-archive

      - name: Unpack the app
        run: |
          mkdir -p build/bin
          tar -C build/bin -xf app-archive/hopto-app.tar

      # A keychain of this job's own for the certificate: the runner's
      # login keychain is not ours to write to, and this one is deleted
      # when the job ends, whatever happened before. The certificate file
      # is removed when the step ends, even when the import fails. Never
      # add `set -x` here: it would print the password.
      - name: Signing keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          # Locks itself after six hours, longer than the job may run:
          # the disk image is signed after the first notarisation wait.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # Ours first on the search list, the ones already there after it.
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "no Developer ID Application identity in the certificate" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # The bundle first, so the image carries a stapled app; then the
      # image itself.
      - name: Sign and notarise the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: bash scripts/sign-and-notarize.sh build/bin/hopto.app

      # The script itself rather than make dmg: the Makefile's variables
      # call git at parse time, and this job needs nothing but bash and
      # hdiutil for it. Same path as make dmg would give.
      - name: Disk image
        run: bash scripts/make-dmg.sh build/bin/hopto.app "build/dist/hopto-$VERSION-macos-universal.dmg"

      - name: Sign and notarise the disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: bash scripts/sign-and-notarize.sh "build/dist/hopto-$VERSION-macos-universal.dmg"

      # What a Mac that just downloaded them would decide. spctl -vv
      # names the source, which is the proof wanted here, and also the
      # origin, the signing identity's full name, which has no place in
      # a public log. So its answer is captured, a refusal fails the
      # step, the source must be a notarised Developer ID, and the
      # answer is printed without the origin line.
      - name: Gatekeeper accepts both
        run: |
          dmg="build/dist/hopto-$VERSION-macos-universal.dmg"

          # gatekeeper runs spctl with the arguments it is given and
          # applies the rules above to its answer.
          gatekeeper() {
            local answer
            local status=0
            answer="$(spctl "$@" 2>&1)" || status=$?
            # grep -v fails when it has no line left to print, which is
            # no reason to stop: the checks below decide.
            printf '%s\n' "$answer" | grep -v '^origin=' || true
            if [ "$status" -ne 0 ]; then
              echo "Gatekeeper refused it (exit status $status)" >&2
              return 1
            fi
            if ! printf '%s\n' "$answer" | grep -qx 'source=Notarized Developer ID'; then
              echo "Gatekeeper accepted it, but not as a notarised Developer ID" >&2
              return 1
            fi
          }

          codesign --verify --deep --strict build/bin/hopto.app
          gatekeeper -a -t exec -vv build/bin/hopto.app
          xcrun stapler validate build/bin/hopto.app
          gatekeeper -a -t open --context context:primary-signature -vv "$dmg"
          xcrun stapler validate "$dmg"

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dist
          path: build/dist/hopto-${{ needs.build.outputs.version }}-macos-universal.dmg
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The two installers; signed by SignPath once the project is approved
  # there and the repository variable SIGNPATH_READY says so. Until then
  # the unsigned files go on as they are. After sign-macos, so no SignPath
  # request, with its approval by hand, is spent on a run whose macOS
  # files were refused.
  windows:
    needs: [build, sign-macos]
    runs-on: windows-latest
    # SignPath waits for somebody to approve the request by hand; the
    # wait below is four hours, and this leaves room for WiX around it.
    timeout-minutes: 300
    # SignPath's action hands this job's token to SignPath's connector,
    # which reads the run's job details and downloads the unsigned
    # artefact with it, so it needs both scopes. The token leaves GitHub:
    # that is why this job is read-only and holds no secret but
    # SignPath's own.
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRODUCT: ${{ needs.build.outputs.product }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: windows-exes
          path: exes

      # The versions proven on a real machine. dotnet puts global tools
      # in a folder the next steps may not have on their path.
      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $env:PATH = "$tools;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The exes go beside the installers, at the root of one folder,
      # because that is the shape SignPath's artefact configuration
      # expects: build/windows/signpath-artifact-configuration.xml.
      - name: Installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # WiX names the architectures its own way.
          $architectures = @{ amd64 = 'x64'; arm64 = 'arm64' }
          foreach ($name in $architectures.Keys) {
            wix build build/windows/msi/hopto.wxs -arch $architectures[$name] `
              -ext WixToolset.Util.wixext `
              -d Version=$env:PRODUCT `
              -d Exe=exes/hopto-windows-$name.exe `
              -d Icon=build/windows/icon.ico `
              -o out/hopto-$env:VERSION-windows-$name.msi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item exes/hopto-windows-$name.exe out/
          }
          Get-ChildItem out

      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: windows-unsigned
          path: out/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # One request for the four files. It waits until somebody approves
      # it on SignPath, for up to four hours instead of the action's ten
      # minutes.
      - name: Sign with SignPath
        if: vars.SIGNPATH_READY == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed

      # SignPath answering is not proof enough: all four files must have
      # come back, each with a valid signature, and signed by SignPath
      # Foundation, since any valid certificate would pass the first test.
      - name: Every file is signed
        if: vars.SIGNPATH_READY == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem signed -File)
          if ($files.Count -ne 4) {
            Write-Error "expected 4 signed files, got $($files.Count): $($files.Name -join ', ')"
            exit 1
          }
          $unsigned = @($files | Where-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            $signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*SignPath Foundation*'
          })
          if ($unsigned.Count -gt 0) {
            Write-Error "not signed by SignPath Foundation: $($unsigned.Name -join ', ')"
            exit 1
          }
          Remove-Item out/*
          Copy-Item signed/* out/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: out/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The zips, the sums and, on a tag, the release. It needs no Go, no
  # Wails and no tags: VERSION reaches make by hand.
  publish:
    needs: [build, sign-macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      # No stored credential: the release is created by gh with GH_TOKEN.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: macos-dist
          path: build/dist

      - uses: actions/download-artifact@v8
        with:
          name: windows-dist
          path: windows

      # The installers are published as they are; the exes go out in
      # their zips, with the licence.
      - name: Zips and sums
        run: |
          mv windows/*.msi build/dist/
          make windows-zips EXES=windows VERSION="$VERSION"
          make sums VERSION="$VERSION"
          ls -l build/dist

      # Exactly the ten files of this version, each sum matching its file,
      # checked right before anything leaves the runner.
      - name: Files and sums agree
        run: |
          cd build/dist
          for file in \
              "hopto-$VERSION-macos-universal.dmg" \
              "hopto-$VERSION-windows-amd64.msi" \
              "hopto-$VERSION-windows-arm64.msi" \
              "hopto-$VERSION-windows-amd64.zip" \
              "hopto-$VERSION-windows-arm64.zip"; do
            test -f "$file" || { echo "missing: $file" >&2; exit 1; }
            test -f "$file.sha256" || { echo "missing: $file.sha256" >&2; exit 1; }
          done
          count="$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$count" != 10 ]; then
            echo "expected 10 files in build/dist, found $count" >&2
            exit 1
          fi
          shasum -a 256 -c ./*.sha256

      # On a tag and in a rehearsal alike, so a rehearsal's files can be
      # downloaded and tried. A rehearsal's are kept five days; a tag's
      # get the repository's default (0 asks for it), since they are the
      # release's files.
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: build/dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ github.ref_type != 'tag' && 5 || 0 }}

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" build/dist/* \
            --title "hopto $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
